name: Social search test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Test public search results
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlencode, urlparse, parse_qs
          import re
          from pathlib import Path
          Path('diagnostics').mkdir(exist_ok=True)
          queries = [('ig-week','site:instagram.com/p/ "_seorina"',True),('ig-all','site:instagram.com/p/ "_seorina"',False),('x-week','site:x.com "설인아"',True)]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(locale='zh-TW')
              for label, query, recent in queries:
                  params = {'q':query,'hl':'zh-TW'}
                  if recent: params['tbs']='qdr:w'
                  try:
                      response = page.goto('https://www.google.com/search?'+urlencode(params),wait_until='domcontentloaded',timeout=30000)
                      page.wait_for_timeout(3000)
                      print(label, 'HTTP', response.status if response else None, 'title', page.title(), 'url', page.url)
                      body = page.locator('body').inner_text(timeout=10000)
                      print('Body preview:', body[:600])
                      page.screenshot(path=f'diagnostics/{label}.png',full_page=True)
                      links = page.locator('a[href]').evaluate_all('(els) => els.map(e => ({url:e.href,text:e.innerText}))')
                      found = set()
                      for item in links:
                          url = item['url']
                          parsed = urlparse(url)
                          if parsed.path == '/url':
                              q = parse_qs(parsed.query)
                              url = (q.get('q') or q.get('url') or [url])[0]
                          u = urlparse(url)
                          if (u.hostname in ('instagram.com','www.instagram.com') and re.match(r'/ (?:p|reel)/'.replace(' ',''),u.path)) or (u.hostname in ('x.com','www.x.com','twitter.com','www.twitter.com') and re.search(r'/status/\d+',u.path)):
                              found.add(url.split('?')[0])
                      print('anchors=',len(links),'matched=',len(found))
                      for url in sorted(found): print(url)
                      if 'captcha' in body.lower() or '/sorry/' in page.url or 'unusual traffic' in body.lower():
                          print('Search restriction detected; stopping test.')
                          break
                  except Exception as e:
                      print(label, type(e).__name__, str(e)[:500])
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-diagnostics
          path: diagnostics/
          if-no-files-found: warn
